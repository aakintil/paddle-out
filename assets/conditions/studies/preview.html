<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO NOW — style studies</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#171c1a;font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1040px;margin:auto;padding:48px 28px 72px}h1{font:500 32px/1.1 Georgia,serif;margin:0}.intro{max-width:650px;color:#68706d;margin:10px 0 34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:38px}.study{margin:0}.study img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.study figcaption{margin-top:14px}.study b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.study p{margin:4px 0 0;color:#68706d;max-width:430px}@media(max-width:680px){.grid{grid-template-columns:1fr}.wrap{padding:28px 20px}}</style></head><body><div class="wrap"><h1>GO NOW — two directions</h1><p class="intro">The same big, clean swell interpreted through two different illustration systems.</p><main class="grid"><figure class="study"><img src="go-now-playful.svg" alt="Playful surfer riding a large green wave"><figcaption><b>Playful</b><p>Elastic black line, exaggerated gesture, friendly energy, and a restrained coastal palette.</p></figcaption></figure><figure class="study"><img src="go-now-maximalist.svg" alt="Surfer riding a vivid patterned wave"><figcaption><b>Maximalist</b><p>Rhythmic pattern, saturated colour, hard contrast, and a much stronger cultural presence.</p></figcaption></figure></main></div></body></html>
