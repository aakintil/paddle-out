<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Surf condition illustrations — screen-print series</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #17201e; font: 14px/1.4 Inter, system-ui, sans-serif; }
    .wrap { max-width: 1100px; margin: auto; padding: 48px 28px 72px; }
    h1 { margin: 0; font: 500 31px/1.1 Georgia, serif; }
    .lede { margin: 10px 0 34px; color: #69716e; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 38px 26px; }
    figure { margin: 0; }
    img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    figcaption { margin-top: 11px; }
    b { display: block; font-size: 11px; letter-spacing: .11em; text-transform: uppercase; }
    span { color: #69716e; }
    @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 460px) { .grid { grid-template-columns: 1fr; } .wrap { padding: 28px 18px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Surf condition illustrations</h1>
    <p class="lede">Vibrant screen-print series · nine condition scenes</p>
    <main class="grid">
      <figure><img src="go-now-big-swell-v3.png" alt="Surfer crouched low ahead of the breaking pocket"><figcaption><b>Go now</b><span>Big swell, clean</span></figcaption></figure>
      <figure><img src="go-now-dawn-patrol.png" alt="Orange sun cresting calm turquoise water"><figcaption><b>Go now</b><span>Dawn patrol</span></figcaption></figure>
      <figure><img src="worth-planning-small-rideable-v2.png" alt="Surfer wading out with one horizontal orange board"><figcaption><b>Worth planning</b><span>Small but rideable</span></figcaption></figure>
      <figure><img src="too-small.png" alt="A surfer waiting among tiny unbroken swell lines"><figcaption><b>Too small</b><span>Swell present, nothing to ride</span></figcaption></figure>
      <figure><img src="too-big-oversized-swell.png" alt="A surfer at the shoreline dwarfed by an enormous clean swell"><figcaption><b>Too big</b><span>Oversized swell</span></figcaption></figure>
      <figure><img src="go-to-lighthouse-instead.png" alt="A surfer walking toward a distant point with a clean breaking wave"><figcaption><b>Go to Lighthouse instead</b><span>Better at the exposed point</span></figcaption></figure>
      <figure><img src="marginal-wind-chop.png" alt="Disordered choppy turquoise water"><figcaption><b>Marginal</b><span>Wind chop</span></figcaption></figure>
      <figure><img src="skip-flat.png" alt="A single surfboard on empty sand beside flat water"><figcaption><b>Skip</b><span>Flat</span></figcaption></figure>
      <figure><img src="skip-stormy.png" alt="Diagonal rain over dark rough water"><figcaption><b>Skip</b><span>Stormy</span></figcaption></figure>
    </main>
  </div>
</body>
</html>
