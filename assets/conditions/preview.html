<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surf condition illustrations</title><style>*{box-sizing:border-box}body{margin:0;padding:48px 32px 72px;background:#fff;color:#17211f;font:14px/1.4 Inter,system-ui,sans-serif}.wrap{max-width:1080px;margin:auto}h1{font:500 30px/1.1 Georgia,serif;margin:0}.lede{max-width:520px;margin:10px 0 32px;color:#66716e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:38px 28px}.card{margin:0}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.card figcaption{margin-top:11px}.card b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.card span{color:#66716e}@media(max-width:760px){body{padding:28px 20px}.grid{grid-template-columns:repeat(2,1fr);gap:28px 16px}}@media(max-width:440px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Surf condition illustrations</h1><p class="lede">Six coastal moods in loose ink, sun-faded colour, and quiet negative space.</p><main class="grid"><figure class="card"><img src="go-now-big-swell.svg" alt=""><figcaption><b>Go now</b><span>Big swell, clean</span></figcaption></figure><figure class="card"><img src="go-now-dawn-patrol.svg" alt=""><figcaption><b>Go now</b><span>Dawn patrol</span></figcaption></figure><figure class="card"><img src="worth-planning-small-rideable.svg" alt=""><figcaption><b>Worth planning</b><span>Small but rideable</span></figcaption></figure><figure class="card"><img src="marginal-wind-chop.svg" alt=""><figcaption><b>Marginal</b><span>Wind chop</span></figcaption></figure><figure class="card"><img src="skip-flat.svg" alt=""><figcaption><b>Skip</b><span>Flat</span></figcaption></figure><figure class="card"><img src="skip-stormy.svg" alt=""><figcaption><b>Skip</b><span>Stormy</span></figcaption></figure></main></div></body></html>
